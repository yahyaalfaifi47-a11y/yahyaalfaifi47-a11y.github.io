<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little English Stars</title>
<meta name="description" content="Little English Stars — English with Yahya">
<meta name="theme-color" content="#2B4C9B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Stars">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#2B4C9B;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(#2B4C9B,#5A70CD);color:#fff;font-family:system-ui,sans-serif;transition:opacity .4s;z-index:2}
  #splash img{width:140px;height:140px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #splash p{margin-top:18px;font-size:18px}
  #offline{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;
    background:#2B4C9B;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:16px;z-index:3}
  #offline button{margin-top:16px;padding:12px 28px;border:0;border-radius:24px;background:#FFC93C;color:#2B4C9B;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-512.png" alt=""><p>Little English Stars</p></div>
<div id="offline"><p style="font-size:20px">لا يوجد اتصال بالإنترنت</p><p>تأكد من الاتصال ثم حاول مرة أخرى</p><button onclick="location.reload()">إعادة المحاولة</button></div>
<iframe id="app" title="Little English Stars" allow="clipboard-write; fullscreen"></iframe>
<script>
  // رابط التطبيق في Google Apps Script — غيّره هنا فقط إذا تغيّر الرابط
  var APP_URL = "https://script.google.com/macros/s/AKfycbxFxePCEmIbQO7icT0nwfCQnxKLOESMBFLTjUtByNSmqqsej0iZnmYO4m9OObffzIDfEA/exec";

  var frame = document.getElementById("app"), splash = document.getElementById("splash");
  function hideSplash(){ splash.style.opacity = 0; setTimeout(function(){ splash.style.display = "none"; }, 400); }
  if (!navigator.onLine) { document.getElementById("offline").style.display = "flex"; }
  else { frame.onload = hideSplash; frame.src = APP_URL; setTimeout(hideSplash, 8000); }
  window.addEventListener("online", function(){ location.reload(); });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
