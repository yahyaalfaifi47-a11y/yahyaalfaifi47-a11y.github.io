<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engoria</title>
<meta name="description" content="Engoria — English with Yahya">
<meta name="theme-color" content="#2B4C9B">
<link rel="manifest" href="manifest.json">
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Engoria">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#2B4C9B;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(#2B4C9B,#5A70CD);color:#fff;font-family:system-ui,sans-serif;transition:opacity .4s;z-index:2}
  #splash img{width:140px;height:140px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #splash p{margin-top:18px;font-size:18px}
  #offline{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;
    background:#2B4C9B;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:16px;z-index:3}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
    font-family:system-ui,sans-serif;font-size:15px;padding:10px 20px;border-radius:20px;z-index:4;display:none;white-space:nowrap}
  #offline button{margin-top:16px;padding:12px 28px;border:0;border-radius:24px;background:#FFC93C;color:#2B4C9B;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div id="splash"><img src="engoria-hero.jpg" alt="" style="width:92%;max-width:440px;height:auto;border-radius:24px"><p>Engoria</p></div>
<div id="offline"><p style="font-size:20px">لا يوجد اتصال بالإنترنت</p><p>تأكد من الاتصال ثم حاول مرة أخرى</p><button onclick="location.reload()">إعادة المحاولة</button></div>
<div id="toast"></div>
<iframe id="app" title="Engoria" allow="clipboard-write; fullscreen"></iframe>
<script>
  // رابط التطبيق في Google Apps Script — غيّره هنا فقط إذا تغيّر الرابط
  var APP_URL = "https://script.google.com/macros/s/AKfycbxFxePCEmIbQO7icT0nwfCQnxKLOESMBFLTjUtByNSmqqsej0iZnmYO4m9OObffzIDfEA/exec";

  var frame = document.getElementById("app"), splash = document.getElementById("splash");
  function hideSplash(){ splash.style.opacity = 0; setTimeout(function(){ splash.style.display = "none"; }, 400); }
  if (!navigator.onLine) { document.getElementById("offline").style.display = "flex"; }
  else { frame.onload = hideSplash; frame.src = APP_URL; setTimeout(hideSplash, 8000); }
  window.addEventListener("online", function(){ location.reload(); });

  // زر الرجوع في الجوال: يرجعك للصفحة السابقة داخل التطبيق، ولا يخرجك ولا يعيدك للتسجيل
  // الخروج فقط من زر "خروج" داخل التطبيق أو بإغلاق التطبيق من الجوال
  var toastTimer, backDone = false, myLen = 0;
  function showToast(t){ var el = document.getElementById("toast"); el.textContent = t; el.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.style.display = "none"; }, 2000); }
  function sendBack(w, depth){ // يرسل أمر "رجوع" لكل الإطارات الداخلية لصفحة Apps Script
    try { w.postMessage("les-back", "*"); } catch(e){}
    if (depth > 4) return;
    try { for (var i = 0; i < w.length; i++) sendBack(w[i], depth + 1); } catch(e){}
  }
  // "حاجز" في سجل الصفحات: يبقى دائماً آخر خطوة، فزر الرجوع يصطدم به هو لا بصفحة الدخول
  function arm(){ try { history.pushState({les:1}, ""); myLen = history.length; } catch(e){} }
  try { history.replaceState({les:0}, ""); } catch(e){}
  arm();
  // إذا أضاف التطبيق خطوات جديدة للسجل (مثل بعد تسجيل الدخول) نعيد الحاجز ليكون آخر خطوة
  setInterval(function(){ if (history.length !== myLen) arm(); }, 700);
  window.addEventListener("message", function(e){ if (e.data === "les-back-done") backDone = true; });
  window.addEventListener("message", function(e){ if (e.data === "les-refresh") location.reload(); });
  window.addEventListener("popstate", function(){
    arm();
    backDone = false;
    sendBack(frame.contentWindow, 0);
    setTimeout(function(){ if (!backDone) showToast("للخروج اضغط زر خروج داخل التطبيق"); }, 450);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
